id: nlr-annual-technology-baseline
type: dataset
title: Annual Technology Baseline (ATB)
description: |
  A consistent set of cost and performance data (capital and operating costs, capacity factors, financing, levelized cost of energy) for electricity generation and transportation technologies in the United States, with projections through 2050, published yearly by the national laboratory formerly called NREL.
publisher: National Laboratory of the Rockies (NLR, formerly the National Renewable Energy Laboratory), for the U.S. Department of Energy
jurisdiction:
  scope: national
  country: US
topics:
- technology-costs
- projections
- electricity
- levelized-cost
source:
  canonical_url: https://atb.nlr.gov/
access:
  method:
  - web
  - bulk
  - s3
  auth_required: false
  auth_note: null
  rate_limit: null
format:
- xlsx
- csv
- parquet
status: live
status_since: '2026-11-01'
status_source: curator
observed:
