notes: |
  Human-verified 2026-10-31: HTTP 200. The site footer states "All content is released under a Creative Commons Attribution Licence (CC-BY-4.0)". The Data menu lists an API alongside the datasets. Ember is a UK think tank (a Community Interest Company) whose data is built on national and multilateral sources. It is cataloged for its open license and coverage; for a primary source, prefer the national statistics agencies. The 2000 start year and the API's auth terms come from Ember's usual description and were not checked here; a steward should confirm them.
