notes: |
  Human-verified 2026-10-31: HTTP 200 (page "Last updated on September 21, 2026"). The detailed-data page (https://www.epa.gov/egrid/detailed-data) lists eGRID2023, released 1/15/2025 with revisions on 1/17/2025 and 6/12/2025, as an xlsx download with a PDF technical guide. Editions now come out roughly yearly but not on a fixed schedule, so cadence is irregular. The 1996 start year comes from EPA's historical editions and should be confirmed by a steward.
