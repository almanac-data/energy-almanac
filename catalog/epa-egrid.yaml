title: EPA Emissions & Generation Resource Integrated Database (eGRID)
description: |
  EPA's comprehensive source of environmental characteristics of almost all U.S. electric power generation — emissions, emission rates, net generation, and resource mix — at plant, state, and grid-subregion level.
