notes: |
  Human-verified 2026-10-31: jodidata.org returned HTTP 200. The data downloads page (https://www.jodidata.org/oil/database/data-downloads.aspx) offers the complete series "from January 2002 to one month-old" for free in .ivt (Beyond 20/20) and .csv. The partners page lists IEF, APEC, Eurostat, GECF, IEA, OLADE, OPEC, and UNSD. The canonical_url /oil/ is the section root; scripts/check_links.py reported it ok (HTTP 200). "Over 100 economies" comes from JODI's usual description and was not checked against the participant list. JODI-Gas is a separate database and deserves its own entry.
