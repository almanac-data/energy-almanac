notes: |
  Human-verified 2026-11-01: HTTP 200 for https://pxweb.irena.org/pxweb/en/IRENASTAT (curl and headless Chromium). On 2026-10-31 the issue reported a 502 here; it answered today. The page reads "IRENASTAT Online Data Query Tool" with topics Finance, Heat Generation, and Power Capacity and Generation. The PX-Web API (https://pxweb.irena.org/api/v1/en/IRENASTAT) returned HTTP 200 JSON. Its Power Capacity and Generation folder lists "Electricity statistics by Country/area, Technology, Data Type, Grid connection and Year" (Country_ELECSTAT_2026_H2_PX.px, updated 2026-09-28), with 224 countries/areas, 26 technologies, capacity (MW) and generation (GWh), and years 2000-2025. The issue's https://www.irena.org/Data returned "403 Forbidden Microsoft-Azure-Application-Gateway/v2" to curl and to headless and headed (xvfb) Chromium, so the PX-Web tool is cataloged. PX-Web usually offers CSV/XLSX exports, which I did not test; only JSON from the API was seen. Cadence is irregular: the table names suggest half-yearly releases (2026_H2).
  Licence checked 2026-11-01: not verified. https://www.irena.org/Terms-of-Use returned 403 to WebFetch, and the whole www.irena.org site returned 403 to curl and to both Chromium modes. The PX-Web footer reads "© 2026 IRENA - International Renewable Energy Agency. All Rights Reserved.", a website footer rather than a data licence. No licence is asserted.
